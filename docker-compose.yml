name: portfolio

services:
  web:
    build:
      context: ./frontend
      args:
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-github}
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    # Phase 2: uncomment so nginx can reach the API
    # depends_on:
    #   - api

  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "web:80", "--log=stdout"]
    # To use a static domain, swap the line above for:
    # command: ["http", "web:80", "--url=${NGROK_DOMAIN}", "--log=stdout"]
    environment:
      # Without a token ngrok exits with an auth error, but `web` still runs on localhost
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040" # inspector, plus /api/tunnels for the public URL
    depends_on:
      - web
    restart: unless-stopped

